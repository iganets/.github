name: Build and publish IGANets Docker images

on:
  workflow_call:
    inputs:
      IGANET_BUILD_TYPE:
        description: CMake build type
        required: false
        type: string
        default: Release
      IGANET_BUILD_CPUONLY:
        description: Build without CUDA support
        required: false
        type: string
        default: "OFF"
      IGANET_BUILD_DOCS:
        description: Build documentation
        required: false
        type: string
        default: "OFF"
      IGANET_BUILD_PCH:
        description: Build precompiled headers
        required: false
        type: string
        default: "ON"
      IGANET_OPTIONAL:
        description: Semicolon-separated optional modules
        required: false
        type: string
        default: ""
      IGANET_WITH_GISMO:
        description: Build with G+Smo
        required: false
        type: string
        default: "OFF"
      IGANET_WITH_MATPLOT:
        description: Build with Matplot++
        required: false
        type: string
        default: "OFF"
      IGANET_WITH_MPI:
        description: Build with MPI
        required: false
        type: string
        default: "OFF"
      IGANET_WITH_OPENMP:
        description: Build with OpenMP
        required: false
        type: string
        default: "ON"
      IMAGE_NAME:
        description: GHCR package base name, without registry or owner
        required: false
        type: string
        default: iganets
      IMAGE_TAG:
        description: Image tag; a Git tag on the triggering commit takes precedence
        required: false
        type: string
        default: latest
      CPU_LABEL:
        description: Label appended to IMAGE_NAME for the CPU runtime image
        required: false
        type: string
        default: cpu
      CPU_DEV_LABEL:
        description: Label appended to IMAGE_NAME for the CPU development image
        required: false
        type: string
        default: cpu-dev
      CUDA_LABEL:
        description: Label appended to IMAGE_NAME for the CUDA runtime image
        required: false
        type: string
        default: cuda
      CUDA_DEV_LABEL:
        description: Label appended to IMAGE_NAME for the CUDA development image
        required: false
        type: string
        default: cuda-dev
      CPU_DOCKERFILE:
        required: false
        type: string
        default: Dockerfile.cpu
      CUDA_DOCKERFILE:
        required: false
        type: string
        default: Dockerfile.cuda
      BUILD_CONTEXT:
        required: false
        type: string
        default: .
      NJOBS:
        description: Number of parallel build jobs
        required: false
        type: string
        default: 1

jobs:
  build:
    name: ${{ matrix.flavor }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile_input: CPU_DOCKERFILE
          - flavor: cpu
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile_input: CPU_DOCKERFILE
          - flavor: cuda
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile_input: CUDA_DOCKERFILE
          - flavor: cuda
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile_input: CUDA_DOCKERFILE

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve matrix inputs
        id: config
        shell: bash
        env:
          CPU_DOCKERFILE: ${{ inputs.CPU_DOCKERFILE }}
          CUDA_DOCKERFILE: ${{ inputs.CUDA_DOCKERFILE }}
          CPU_DEV_LABEL: ${{ inputs.CPU_DEV_LABEL }}
          CUDA_DEV_LABEL: ${{ inputs.CUDA_DEV_LABEL }}
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile_input }}
          MATRIX_DEV_LABEL: ${{ matrix.flavor == 'cpu' && 'CPU_DEV_LABEL' || 'CUDA_DEV_LABEL' }}
        run: |
          echo "dockerfile=${!MATRIX_DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "dev-image=ghcr.io/${{ github.repository_owner }}/${{ inputs.IMAGE_NAME }}-${!MATRIX_DEV_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push development image
        id: build-dev
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.BUILD_CONTEXT }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: dev
          outputs: type=image,name=${{ steps.config.outputs.dev-image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IGANET_BUILD_TYPE=${{ inputs.IGANET_BUILD_TYPE }}
            IGANET_BUILD_CPUONLY=${{ inputs.IGANET_BUILD_CPUONLY }}
            IGANET_BUILD_DOCS=${{ inputs.IGANET_BUILD_DOCS }}
            IGANET_BUILD_PCH=${{ inputs.IGANET_BUILD_PCH }}
            IGANET_OPTIONAL=${{ inputs.IGANET_OPTIONAL }}
            IGANET_WITH_GISMO=${{ inputs.IGANET_WITH_GISMO }}
            IGANET_WITH_MATPLOT=${{ inputs.IGANET_WITH_MATPLOT }}
            IGANET_WITH_MPI=${{ inputs.IGANET_WITH_MPI }}
            IGANET_WITH_OPENMP=${{ inputs.IGANET_WITH_OPENMP }}
            NJOBS=${{ inputs.NJOBS }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}-dev
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.arch }}-dev

      - name: Export development image digest
        env:
          DIGEST: ${{ steps.build-dev.outputs.digest }}
        run: |
          mkdir -p /tmp/digests-dev
          touch "/tmp/digests-dev/${DIGEST#sha256:}"

      - name: Upload development image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.flavor }}-dev-${{ matrix.arch }}
          path: /tmp/digests-dev/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push production image
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.BUILD_CONTEXT }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.IMAGE_NAME }}-${{ matrix.flavor == 'cpu' && inputs.CPU_LABEL || inputs.CUDA_LABEL }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IGANET_BUILD_TYPE=${{ inputs.IGANET_BUILD_TYPE }}
            IGANET_BUILD_CPUONLY=${{ inputs.IGANET_BUILD_CPUONLY }}
            IGANET_BUILD_DOCS=${{ inputs.IGANET_BUILD_DOCS }}
            IGANET_BUILD_PCH=${{ inputs.IGANET_BUILD_PCH }}
            IGANET_OPTIONAL=${{ inputs.IGANET_OPTIONAL }}
            IGANET_WITH_GISMO=${{ inputs.IGANET_WITH_GISMO }}
            IGANET_WITH_MATPLOT=${{ inputs.IGANET_WITH_MATPLOT }}
            IGANET_WITH_MPI=${{ inputs.IGANET_WITH_MPI }}
            IGANET_WITH_OPENMP=${{ inputs.IGANET_WITH_OPENMP }}
            NJOBS=${{ inputs.NJOBS }}
          cache-from: |
            type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}-dev
            type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}-runtime
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.arch }}-runtime

      - name: Export production image digest
        env:
          DIGEST: ${{ steps.build-runtime.outputs.digest }}
        run: |
          mkdir -p /tmp/digests-runtime
          touch "/tmp/digests-runtime/${DIGEST#sha256:}"

      - name: Upload production image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.flavor }}-runtime-${{ matrix.arch }}
          path: /tmp/digests-runtime/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.flavor }} ${{ matrix.kind }} manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            kind: dev
            label_input: CPU_DEV_LABEL
          - flavor: cpu
            kind: runtime
            label_input: CPU_LABEL
          - flavor: cuda
            kind: dev
            label_input: CUDA_DEV_LABEL
          - flavor: cuda
            kind: runtime
            label_input: CUDA_LABEL

    steps:
      - name: Resolve publication settings
        id: publish
        shell: bash
        env:
          CPU_LABEL: ${{ inputs.CPU_LABEL }}
          CPU_DEV_LABEL: ${{ inputs.CPU_DEV_LABEL }}
          CUDA_LABEL: ${{ inputs.CUDA_LABEL }}
          CUDA_DEV_LABEL: ${{ inputs.CUDA_DEV_LABEL }}
          MATRIX_LABEL: ${{ matrix.label_input }}
          REQUESTED_TAG: ${{ inputs.IMAGE_TAG }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          label=${!MATRIX_LABEL}
          tag=$REQUESTED_TAG
          if [[ $REF_TYPE == tag ]]; then
            tag=$REF_NAME
          fi
          if [[ ! $label =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Invalid image label: $label" >&2
            exit 1
          fi
          if [[ ! $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ inputs.IMAGE_NAME }}-${label}" >> "$GITHUB_OUTPUT"
          echo "package=${{ inputs.IMAGE_NAME }}-${label}" >> "$GITHUB_OUTPUT"

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.flavor }}-${{ matrix.kind }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push multi-platform manifest
        shell: bash
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${IMAGE}@sha256:${digest_file##*/}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${TAG}-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Keep the three latest builds for this image and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ steps.publish.outputs.package }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if [[ $OWNER_TYPE == Organization ]]; then
            endpoint="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            endpoint="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          fi
          mapfile -t old_version_ids < <(
            gh api --paginate --slurp "$endpoint?per_page=100" |
              jq -r --arg prefix "${TAG}-build-" \
                'add | map(select(any(.metadata.container.tags[]; startswith($prefix)))) | sort_by(.created_at) | reverse | .[3:] | .[].id'
          )
          for version_id in "${old_version_ids[@]}"; do
            gh api --method DELETE "${endpoint}/${version_id}"
          done
